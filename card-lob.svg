<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 252" width="480" height="252" role="img" aria-label="Limit order book simulator project card">
<title>Limit order book simulator project card</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14123A"/><stop offset="1" stop-color="#231A5C"/></linearGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#3DDBB0" stop-opacity="0"/><stop offset=".5" stop-color="#3DDBB0"/><stop offset="1" stop-color="#6C4CF1" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx="85%" cy="25%" r="60%"><stop offset="0" stop-color="#6C4CF1" stop-opacity=".5"/><stop offset="1" stop-color="#6C4CF1" stop-opacity="0"/></radialGradient>
<clipPath id="cl"><rect width="480" height="252" rx="16"/></clipPath>
</defs>
<style>
.sweep{animation:sweep 5s linear infinite}
@keyframes sweep{0%{transform:translateX(-170px)}100%{transform:translateX(520px)}}
.glow{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bb,.ab{transform-box:fill-box;animation:depth 2.4s ease-in-out infinite alternate}
.bb{transform-origin:right center}.ab{transform-origin:left center}
@keyframes depth{from{transform:scaleX(.5)}to{transform:scaleX(1)}}</style>
<rect width="480" height="252" rx="16" fill="url(#bg)"/>
<rect width="480" height="252" rx="16" fill="url(#gl)" class="glow"/>
<g clip-path="url(#cl)"><rect class="sweep" x="0" y="0" width="170" height="3" fill="url(#sw)"/></g>
<rect x=".5" y=".5" width="479" height="251" rx="16" fill="none" stroke="#6C4CF1" stroke-opacity=".55"/>
<text x="24" y="28" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10" letter-spacing="1.6" fill="#FF6B5E">QUANT  ·  MICROSTRUCTURE</text>
<text x="24" y="52" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">LOB Simulator &amp; Market Maker</text>
<text x="24" y="72" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#B9B4E8">Event-driven order book and an XGBoost alpha,</text><text x="24" y="89" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#B9B4E8">stress-tested with adverse selection.</text>
<text x="24" y="148" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="21" font-weight="700" fill="#3DDBB0">O(1)</text><text x="24" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#B9B4E8">deque book ops</text><text x="116" y="148" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="21" font-weight="700" fill="#3DDBB0">~67%</text><text x="116" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#B9B4E8">OOS acc. (sim)</text><text x="208" y="148" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="21" font-weight="700" fill="#3DDBB0">35%</text><text x="208" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#B9B4E8">fill on winners</text>
<g transform="translate(300,98)"><rect class="bb" style="animation-delay:0.00s" x="44" y="4" width="30" height="9" rx="2" fill="#3DDBB0" fill-opacity=".85"/><rect class="ab" style="animation-delay:0.00s" x="82" y="4" width="26" height="9" rx="2" fill="#FF6B5E" fill-opacity=".85"/><rect class="bb" style="animation-delay:0.28s" x="28" y="18" width="46" height="9" rx="2" fill="#3DDBB0" fill-opacity=".85"/><rect class="ab" style="animation-delay:0.28s" x="82" y="18" width="40" height="9" rx="2" fill="#FF6B5E" fill-opacity=".85"/><rect class="bb" style="animation-delay:0.56s" x="36" y="32" width="38" height="9" rx="2" fill="#3DDBB0" fill-opacity=".85"/><rect class="ab" style="animation-delay:0.56s" x="82" y="32" width="52" height="9" rx="2" fill="#FF6B5E" fill-opacity=".85"/><rect class="bb" style="animation-delay:0.84s" x="14" y="46" width="60" height="9" rx="2" fill="#3DDBB0" fill-opacity=".85"/><rect class="ab" style="animation-delay:0.84s" x="82" y="46" width="34" height="9" rx="2" fill="#FF6B5E" fill-opacity=".85"/><rect class="bb" style="animation-delay:1.12s" x="24" y="60" width="50" height="9" rx="2" fill="#3DDBB0" fill-opacity=".85"/><rect class="ab" style="animation-delay:1.12s" x="82" y="60" width="62" height="9" rx="2" fill="#FF6B5E" fill-opacity=".85"/><rect class="bb" style="animation-delay:1.40s" x="4" y="74" width="70" height="9" rx="2" fill="#3DDBB0" fill-opacity=".85"/><rect class="ab" style="animation-delay:1.40s" x="82" y="74" width="48" height="9" rx="2" fill="#FF6B5E" fill-opacity=".85"/><line x1="78" y1="0" x2="78" y2="80" stroke="#FFFFFF" stroke-opacity=".45" stroke-dasharray="3 3"/><text x="70" y="94" text-anchor="end" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="9" fill="#3DDBB0">BID</text><text x="86" y="94" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="9" fill="#FF6B5E">ASK</text></g>
<rect x="24.0" y="208" width="56.4" height="22" rx="11" fill="#6C4CF1" fill-opacity="0.22" stroke="#6C4CF1" stroke-opacity="0.55"/><text x="52.2" y="223" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" fill="#EEEAFE">Python</text><rect x="88.4" y="208" width="56.4" height="22" rx="11" fill="#6C4CF1" fill-opacity="0.22" stroke="#6C4CF1" stroke-opacity="0.55"/><text x="116.6" y="223" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" fill="#EEEAFE">Pandas</text><rect x="152.8" y="208" width="50.0" height="22" rx="11" fill="#6C4CF1" fill-opacity="0.22" stroke="#6C4CF1" stroke-opacity="0.55"/><text x="177.8" y="223" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" fill="#EEEAFE">NumPy</text><rect x="210.8" y="208" width="62.8" height="22" rx="11" fill="#6C4CF1" fill-opacity="0.22" stroke="#6C4CF1" stroke-opacity="0.55"/><text x="242.2" y="223" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" fill="#EEEAFE">XGBoost</text>
</svg>