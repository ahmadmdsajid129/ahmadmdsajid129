<text x="24" y="148" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="21" font-weight="700" fill="#3DDBB0">92 ms</text><text x="24" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#B9B4E8">p95 latency</text><text x="116" y="148" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="21" font-weight="700" fill="#3DDBB0">61/61</text><text x="116" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#B9B4E8">tests passing</text><text x="208" y="148" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="21" font-weight="700" fill="#3DDBB0">114</text><text x="208" y="164" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#B9B4E8">commits</text>
<g transform="translate(300,98)">
<circle cx="50" cy="50" r="34" fill="none" stroke="#EEEAFE" stroke-opacity=".12" stroke-width="8"/>
<circle class="ring" cx="50" cy="50" r="34" fill="none" stroke="#3DDBB0" stroke-width="8" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="213.63" stroke-dashoffset="3.74"/>
<text x="50" y="53" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#FFFFFF">0.98</text>
<text x="50" y="66" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#B9B4E8">PR-AUC</text>
<g class="pill p1"><rect x="104" y="12" width="52" height="20" rx="10" fill="#3DDBB0"/><text x="130" y="25.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="8" font-weight="700" fill="#14123A">APPROVE</text></g>
<g class="pill p2"><rect x="104" y="40" width="52" height="20" rx="10" fill="#FFC857"/><text x="130" y="53.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="8" font-weight="700" fill="#14123A">REVIEW</text></g>
<g class="pill p3"><rect x="104" y="68" width="52" height="20" rx="10" fill="#FF6B5E"/><text x="130" y="81.5" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="8" font-weight="700" fill="#14123A">BLOCK</text></g></g>
