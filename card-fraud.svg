<style>
.sweep{animation:sweep 5s linear infinite}
@keyframes sweep{0%{transform:translateX(-170px)}100%{transform:translateX(520px)}}
.glow{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.ring{animation:ringfill 4s ease-out infinite}
@keyframes ringfill{0%{stroke-dashoffset:213.63}60%,100%{stroke-dashoffset:3.74}}
.pill{animation:pill 3s ease-in-out infinite}
.p2{animation-delay:1s}.p3{animation-delay:2s}
@keyframes pill{0%{opacity:.3}10%,30%{opacity:1}45%,100%{opacity:.3}}</style>
<rect width="480" height="252" rx="16" fill="url(#bg)"/>
<rect width="480" height="252" rx="16" fill="url(#gl)" class="glow"/>
<g clip-path="url(#cl)"><rect class="sweep" x="0" y="0" width="170" height="3" fill="url(#sw)"/></g>
<rect x=".5" y=".5" width="479" height="251" rx="16" fill="none" stroke="#6C4CF1" stroke-opacity=".55"/>
<text x="24" y="28" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10" letter-spacing="1.6" fill="#FF6B5E">AI / ML  ·  STREAMING</text>
<text x="24" y="52" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Real-Time Payment Fraud Engine</text>
